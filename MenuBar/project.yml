name: iOSOTA
options:
  bundleIdPrefix: com.appler
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iOSOTA:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appler.ios-ota.menubar
        PRODUCT_NAME: iOS OTA
        PRODUCT_MODULE_NAME: iOSOTA
        CODE_SIGN_IDENTITY: "-"         # signed to run on this Mac only
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_LSUIElement: YES  # a menu bar app: no Dock icon
        INFOPLIST_KEY_CFBundleDisplayName: iOS OTA
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
